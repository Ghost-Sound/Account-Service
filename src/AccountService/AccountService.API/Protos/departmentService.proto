syntax = "proto3";

option csharp_namespace = "AccountService.API.Grpc.Service";

package departmentService;

import "Protos/sortParameter.proto";
import "Protos/Ulid.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

service DepartmentService {
    rpc GetDepartmentById(UlidDepartment) returns(GetDepartmentModel) {
        option (google.api.http) = {
            get: "/v1/department/{id.value}"
        };
    };

    rpc GetDepartments(GetDepartmentsModel) returns(GetDepartmentsGetModel) {
        option (google.api.http) = {
            get: "/v1/departments"
        };
    };

    rpc CreateDepartment(CreateDepartmentModel) returns(GetDepartmentModel) {
        option (google.api.http) = {
            post: "/v1/department"
        };
    };

    rpc DeleteDepartmentById(UlidDepartment) returns(google.protobuf.Empty) {
        option (google.api.http) = {
            delete: "/v1/department/{id.value}"
        };
    };

    rpc UpdateDepartmentById(UpdateDepartmentModel) returns(GetDepartmentModel) {
        option (google.api.http) = {
            patch: "/v1/department/{id.value}"
        };
    }
}

message GetDepartmentsModel {
  repeated SortParameter.SortParameter sort_parameters = 1;
  int32 page_size = 2;
  int32 page = 3;
}

message GetDepartmentModel {
	UlidGrpc.UlidGrpc idDepartment = 1;
	string name = 2;
	string descrtiption = 3;
	string email = 4;
	string phoneNumber = 5;
	repeated UlidGrpc.UlidGrpc users = 6;
	google.protobuf.Timestamp creationDate = 7;
	google.protobuf.Timestamp lastModifiedDate = 8;
}

message GetDepartmentsGetModel {
	repeated GetDepartmentModel departments = 1;
}

message UlidDepartment {
    UlidGrpc.UlidGrpc id = 1;
}

message CreateDepartmentModel {
	string name = 1;
	string desctiption = 2;
	string email = 3;
	string phoneNumber = 4;
	repeated UlidGrpc.UlidGrpc users = 5;
}

message UpdateDepartmentModel {
	UlidGrpc.UlidGrpc id = 1;
	string name = 2;
	string desctiption = 3;
	string email = 4;
	string phoneNumber = 5;
	repeated UlidGrpc.UlidGrpc users = 6;
}


