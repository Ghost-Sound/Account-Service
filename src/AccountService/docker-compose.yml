version: '3.4'

services:
 sqlserver:
    image: mcr.microsoft.com/mssql/server:latest
    environment:
      SA_PASSWORD: "YourStrong@Passw0rd"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    networks:
      - learning

 redis:
    image: redis:latest
    ports:
      - "6379:6379"
      - "8001:8001"
    networks:
      - learning

 rabbitmq:
    image: rabbitmq:management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - learning

 accountservice.api:
    image: ${DOCKER_REGISTRY-}accountserviceapi
    build:
      context: .
      dockerfile: AccountService.API/Dockerfile
    depends_on:
      - sqlserver
      - redis
      - rabbitmq
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    links:
      - "sqlserver"
      - "redis"
      - "rabbitmq"
    restart: always
    ports:
      - "8082:8080"
      - "8083:8081"
    networks:
      - learning

networks:
  learning:
    external: true