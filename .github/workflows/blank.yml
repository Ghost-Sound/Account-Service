# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Cache dependencies
      uses: actions/cache@v2
      with:
        path: |
          ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Setup .NET
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: '8.0.x' 


    - name: Update nuget.config with secrets
      run: |
        sed -i "s#secretUrl#${{ vars.URL_TO_NUGET }}#g" src/AccountService/AccountService.API/nuget.config
        sed -i "s#secretUser#${{ secrets.NUGET_PACKAGE_USERNAME }}#g" src/AccountService/AccountService.API/nuget.config
        sed -i "s#Secretpass#${{ secrets.API_NUGET_KEY_NEW }}#g" src/AccountService/AccountService.API/nuget.config

    - name: Restore dependencies
      run: dotnet restore --configfile src/AccountService/AccountService.API/nuget.config
      working-directory: src/AccountService/AccountService.API 
      
    - name: Build
      run: dotnet build --configuration Release
      working-directory: src/AccountService/AccountService.API

    - name: Test
      run: dotnet test --configuration Release --no-restore
      working-directory: src/AccountService/AccountService.API
